[package]
name = "traffic-counter"
version = "0.0.0-alpha"
edition.workspace = true

license.workspace = true

[dependencies]
aya = { workspace = true }
anyhow = { workspace = true, default-features = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "signal",
] }
clap = { workspace = true, features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
traffic-counter-common = { workspace = true, features = ["user"] }
libc = { workspace = true }
hyper = { version = "0.14", features = ["full"] }
prometheus = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
kube = { version = "0.90.0", default-features = false, features = ["client", "rustls-tls", "runtime"] }
k8s-openapi = { version = "0.21.1", features = ["latest"], default-features = false }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
futures = "0.3"
api = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
tonic-build = "0.11"

[[bin]]
name = "traffic-counter"
path = "src/main.rs"
