apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-counter
  labels:
    app.kubernetes.io/name: traffic-counter
    app.kubernetes.io/part-of: traffic-counter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-counter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-counter
        app.kubernetes.io/part-of: traffic-counter
    spec:
      serviceAccountName: traffic-counter
      dnsPolicy: ClusterFirst
      tolerations:
        - operator: Exists
      containers:
        - name: traffic-counter
          image: ghcr.io/dinoallo/traffic-counter:latest
          imagePullPolicy: IfNotPresent
          command:
            - traffic-counter
          args:
            - run
            - --export-interval-secs=10
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          resources:
            limits:
              cpu: "1"
              memory: 2048Mi
            requests:
              cpu: 25m
              memory: 10Mi
      terminationGracePeriodSeconds: 10
