apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traffic-counter
  labels:
    app.kubernetes.io/name: traffic-counter
    app.kubernetes.io/part-of: traffic-counter
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traffic-counter
  labels:
    app.kubernetes.io/name: traffic-counter
    app.kubernetes.io/part-of: traffic-counter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traffic-counter
subjects:
  - kind: ServiceAccount
    name: traffic-counter
    namespace: traffic-counter
