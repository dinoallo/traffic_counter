name: CI

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/ci.yml"
      - "traffic-counter/**"
      - "Cargo.lock"
      - "Cargo.toml"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/ci.yml"
      - "traffic-counter/**"
      - "Cargo.lock"
      - "Cargo.toml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          default: true
          components: clippy,rustfmt

      - name: Install Nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          override: true
          components: clippy,rustfmt,rust-src

      - name: Install build dependencies and target
        run: |
          sudo apt-get update
          sudo apt-get install -y git make protobuf-compiler

      - name: Install bpf linker
        run: |
          command -v bpf-linker >/dev/null 2>&1 || cargo install bpf-linker

      - name: Check dependencies
        run: make check-deps

      - name: Format check
        run: cargo fmt -p traffic-counter -- --check

      - name: Clippy
        run: cargo clippy -p traffic-counter --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test -p traffic-counter --all-features --quiet
