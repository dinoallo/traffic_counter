name: publish-higress-l4-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag (defaults to short commit SHA)"
        required: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PROVIDER_NAME: higress-l4
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/traffic-counter/providers/higress-l4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Higress WASM plugin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: providers/higress-l4/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          build-args: |
            PROVIDER_NAME=${{ env.PROVIDER_NAME }}
            BUILD_OPTS=--manifest-path /workspace/providers/higress-l4/Cargo.toml --release
