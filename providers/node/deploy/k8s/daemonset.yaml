apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traffic-node-provider
  labels:
    app.kubernetes.io/name: traffic-node-provider
    app.kubernetes.io/part-of: traffic-counter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-node-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-node-provider
        app.kubernetes.io/part-of: traffic-counter
    spec:
      serviceAccountName: traffic-node-provider
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: traffic-node-provider
          image: ghcr.io/dinoallo/traffic-provider/node:latest
          imagePullPolicy: IfNotPresent
          command:
            - node-provider
          args:
            - run
            - --iface=eth0
            - --ignore-file=/etc/traffic-node-provider/ignore.txt
            - --accept-source-file=/etc/traffic-node-provider/accept.txt
            - --server-addr=traffic-counter.traffic-counter.svc.cluster.local:50051
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_RAW
                - SYS_ADMIN
            privileged: false
          resources:
            limits:
              cpu: "1"
              memory: 100Mi
            requests:
              cpu: 25m
              memory: 10Mi
          volumeMounts:
            - name: traffic-node-provider-files
              mountPath: /etc/traffic-node-provider
              readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
        - name: traffic-node-provider-files
          configMap:
            name: traffic-node-provider-files
